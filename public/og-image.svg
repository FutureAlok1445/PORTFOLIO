<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050608" />
      <stop offset="60%" stop-color="#090c14" />
      <stop offset="100%" stop-color="#141a29" />
    </linearGradient>
    <radialGradient id="sun-glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#fff2d6" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#c99a5e" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#c99a5e" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#050608" stop-opacity="0" />
